<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliq Migration — Prototype</title>
<style>
  :root{
    --bg:#f4f6f8; --white:#fff;
    --sidebar-ink:#39415a; --sidebar-head:#2b3145;
    --nav-active-bg:#e9f1fb; --nav-active-ink:#2b7fe0;
    --teal:#1a8a9c; --teal-deep:#0d6f80;
    --green:#5cb488; --green-deep:#4a9d74;
    --blue:#2563eb; --blue-deep:#1d4fd0;
    --line:#e7e9ee; --line-soft:#eef0f4;
    --ink:#2b3145; --soft:#6b7385; --faint:#98a0b0;
    --danger:#dc5a5a; --danger-bg:#fdeeee; --warn:#c9871f; --warn-bg:#fdf5e6;
    --ok:#4a9d74; --ok-bg:#eaf6ef;
    --dm-bg:#0d1b2e; --dm-panel:#132339; --dm-bubble:#16273f; --dm-ink:#c7d2e2; --dm-faint:#7f8ca3;
    --chip:#1a8a9c;
    --radius:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:#20232b;color:var(--ink);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}

  /* ---------- prototype shell ---------- */
  .proto-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    background:#12151c;color:#e8eaf0;padding:10px 18px;border-bottom:1px solid #2b2f3a}
  .proto-top b{font-size:15px;letter-spacing:.2px}
  .proto-top .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .proto-top .muted{color:#8b93a6;font-size:12.5px}
  .proto-top .legend{margin-left:auto;display:flex;gap:16px;font-size:12px;color:#aab2c4;flex-wrap:wrap}
  .proto-top .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

  .layout{display:flex;min-height:calc(100vh - 43px)}
  .map{width:270px;flex:0 0 270px;background:#171b23;color:#c3cad8;padding:14px 12px 40px;overflow:auto}
  .map h4{margin:16px 8px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#79839a}
  .map h4:first-child{margin-top:2px}
  .map a{display:block;padding:8px 10px;border-radius:8px;color:#c3cad8;text-decoration:none;font-size:13px;margin:2px 0}
  .map a:hover{background:#212734;color:#fff}
  .map a.active{background:#243244;color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
  .map a .tg{font-size:10px;color:#8b93a6;display:block;margin-top:1px}

  .stage{flex:1;background:var(--bg);overflow:auto;position:relative}
  .device{min-height:100%;}

  /* ---------- Cliq chrome ---------- */
  .cliq-head{display:flex;align-items:center;gap:14px;background:var(--white);border-bottom:1px solid var(--line);padding:12px 20px}
  .cliq-logo{font-weight:700;color:#111;display:flex;align-items:center;gap:6px}
  .cliq-logo .mk{color:var(--teal);font-size:18px}
  .crumb{color:var(--faint);font-size:13px}
  .crumb b{color:#333;font-weight:600}
  .cliq-body{display:flex}
  .cliq-nav{width:210px;flex:0 0 210px;background:var(--white);border-right:1px solid var(--line);padding:14px 0;min-height:640px}
  .cliq-nav .grp{padding:9px 18px;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--sidebar-head);text-transform:uppercase;display:flex;justify-content:space-between;opacity:.85}
  .cliq-nav .it{padding:7px 18px;color:var(--sidebar-ink);font-size:13px}
  .cliq-nav .it.sub{padding-left:34px;color:var(--soft)}
  .cliq-nav .it.on{background:var(--nav-active-bg);color:var(--nav-active-ink);border-radius:0}
  .cliq-main{flex:1;padding:26px 30px 60px;min-height:640px;position:relative}

  /* wizard */
  .wiz{display:grid;grid-template-columns:230px 1fr;gap:28px;max-width:1180px;margin:0 auto}
  .steps{background:var(--white);border-radius:12px;padding:26px 20px;height:max-content;box-shadow:0 1px 0 var(--line)}
  .step{display:flex;align-items:center;gap:12px;padding:11px 6px;color:var(--faint)}
  .step .n{width:30px;height:30px;border-radius:50%;border:1.5px solid #cfd5e0;display:grid;place-items:center;font-weight:600;font-size:13px;color:#a7afc0;flex:0 0 30px}
  .step.done .n,.step.cur .n{background:var(--teal);border-color:var(--teal);color:#fff}
  .step.done,.step.cur{color:var(--teal);font-weight:600}
  .step.cur{position:relative}
  .step.cur:before{content:"";position:absolute;left:-20px;top:4px;bottom:4px;width:3px;background:var(--teal);border-radius:3px}
  .prog{margin:18px 6px 4px;font-size:13px;color:var(--soft)}
  .prog b{color:var(--teal)}
  .bars{display:flex;gap:6px;margin:8px 6px 18px}
  .bars i{height:6px;border-radius:4px;flex:1;background:#e3e7ee}
  .bars i.f{background:var(--teal)}
  .help{border-top:1px solid var(--line);padding-top:14px;margin:0 6px;text-align:center;color:var(--teal);font-size:13px}

  .panel{background:var(--white);border-radius:12px;padding:0;box-shadow:0 1px 0 var(--line);min-height:520px;display:flex;flex-direction:column}
  .panel-h{font-weight:300;font-size:26px;color:#5c6270;text-align:center;padding:26px 24px 6px}
  .panel-b{padding:8px 30px 24px;flex:1}
  .panel-f{padding:16px 24px;display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--line-soft)}

  /* buttons */
  .btn{border:none;border-radius:22px;padding:12px 34px;font-size:14.5px;font-weight:600;color:#fff}
  .btn.green{background:var(--green)} .btn.green:hover{background:var(--green-deep)}
  .btn.blue{background:var(--blue)} .btn.blue:hover{background:var(--blue-deep)}
  .btn.ghost{background:#fff;color:var(--soft);border:1px solid #d6dae2;border-radius:6px;padding:9px 20px}
  .btn.blue.sq{border-radius:6px;padding:9px 22px}
  .btn.dis{background:#c9ced8;cursor:not-allowed}
  .btn.sm{padding:8px 18px;font-size:13px}
  .btn.danger{background:var(--danger)} .btn.danger:hover{background:#c94b4b}

  /* upload card */
  .upcard{border:1px solid var(--line);border-radius:12px;flex:1;display:grid;place-items:center;margin:6px 0}
  .filebox{text-align:center;color:var(--soft)}
  .filebox .fico{width:64px;height:78px;border:2px solid #cfe8ea;border-radius:8px;display:grid;place-items:center;margin:0 auto 12px;color:var(--teal);font-size:26px}
  .dashed{border:1.5px dashed #c7ccd6;border-radius:12px;flex:1;display:grid;place-items:center;color:var(--soft);margin:4px 0}

  /* channel list */
  .clist{max-width:760px;margin:6px auto 0}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line-soft)}
  .crow.head{color:var(--soft);font-weight:600;border-bottom:1px solid var(--line)}
  .crow .who{margin-left:auto;color:var(--soft);font-size:13px}
  .grp-t{font-weight:700;color:#39415a;margin:16px 8px 2px;font-size:13px}
  .selbar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line)}
  .selbar .count{margin-left:auto;color:var(--teal);font-weight:600}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
  input[type=radio]{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}

  .radio-row{display:flex;gap:12px;align-items:flex-start;padding:12px 6px}
  .cols{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;max-width:820px;margin:10px auto}
  .cols .or{display:grid;place-items:center;color:var(--faint)}
  .cols h5{font-size:16px;font-weight:600;margin:0 0 6px}
  .cols .u{height:2px;background:var(--teal);width:38px;margin-bottom:12px}
  .opt{display:flex;gap:10px;align-items:center;padding:10px 4px}

  /* generic info blocks */
  .why{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:900px;margin:6px auto}
  .why h3{margin:2px 0 6px;font-size:15px}
  .why p,.why li{color:#4a4f5e}
  .ss{border:1px solid var(--line);border-radius:12px;max-width:820px;margin:14px auto;overflow:hidden}
  .ss img{width:100%;display:block}

  /* processing */
  .proc{max-width:760px;margin:0 auto;text-align:center}
  .proc .row{display:flex;align-items:center;justify-content:center;gap:26px;margin:22px 0}
  .proc .app{width:120px;height:120px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:grid;place-items:center;background:#fff;font-size:34px}
  .proc .dots{color:var(--teal);letter-spacing:3px}
  .proc .stat{display:flex;gap:34px;justify-content:center;margin-top:8px;color:var(--soft)}
  .proc .stat b{display:block;color:var(--teal);font-size:20px}

  /* summary (Feature 2) */
  .sum{max-width:960px;margin:0 auto}
  .banner{border-radius:10px;padding:16px 18px;margin:6px 0 16px;display:flex;gap:12px;align-items:flex-start}
  .banner.warn{background:var(--warn-bg);border:1px solid #f0dcae}
  .banner.ok{background:var(--ok-bg);border:1px solid #cde9d8}
  .banner.bad{background:var(--danger-bg);border:1px solid #f2c9c9}
  .banner .bi{font-size:20px}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  .kc .lab{color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .kc .big{font-size:22px;font-weight:700;margin-top:4px}
  .kc .fail{color:var(--danger);font-size:12px;margin-top:3px}
  .kc .fail.zero{color:var(--faint)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:2px;flex-wrap:wrap}
  .tab{padding:10px 16px;border:none;background:none;color:var(--soft);font-weight:600;border-bottom:2px solid transparent}
  .tab.on{color:var(--teal);border-bottom-color:var(--teal)}
  .sec{margin:16px 0}
  .sec .st{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
  .sec .st .badge{font-size:11px;padding:2px 8px;border-radius:20px}
  .badge.miss{background:var(--warn-bg);color:var(--warn)}
  .badge.failed{background:var(--danger-bg);color:var(--danger)}
  .sec .desc{color:var(--soft);margin:0 0 8px;font-size:13px}
  .frow{display:grid;grid-template-columns:1.1fr 1.4fr 1.5fr;gap:12px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:8px;margin-bottom:6px;align-items:center;background:#fff}
  .frow .id b{display:block}
  .frow .id span{color:var(--faint);font-size:12px}
  .frow .rs{color:#7a4}
  .rtag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f0f2f6;color:var(--soft);display:inline-block}
  .fix{color:var(--teal);font-size:13px}
  .sumacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

  /* merge (Feature 1) */
  .mwrap{max-width:940px;margin:0 auto}
  .lead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .lead h3{margin:0 0 4px;font-size:17px}
  .lead p{margin:0;color:var(--soft)}
  .bulkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .bulkbar .lab{color:var(--soft);font-size:13px}
  .mini{border:1px solid #cdd3dd;background:#fff;border-radius:16px;padding:6px 14px;font-size:12.5px;color:var(--ink)}
  .mini:hover{border-color:var(--teal);color:var(--teal)}
  .tally{margin-left:auto;font-size:13px;color:var(--soft)}
  .tally b{color:var(--ink)}
  .mrow{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
  .mrow .top{display:flex;align-items:center;gap:12px}
  .avs{display:flex}
  .avs .av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;margin-left:-8px;border:2px solid #fff}
  .avs .av:first-child{margin-left:0}
  .mrow .meta{color:var(--soft);font-size:12.5px}
  .mopts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
  .mopt{border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;transition:.12s}
  .mopt:hover{border-color:#b9d9df}
  .mopt.sel{border-color:var(--teal);background:#f0fafb}
  .mopt .lb{font-weight:600;display:flex;align-items:center;gap:8px}
  .mopt .im{font-size:12px;color:var(--soft);margin-top:5px}
  .mopt .im.warn{color:var(--danger)}
  .rec{font-size:10px;background:var(--teal);color:#fff;padding:1px 7px;border-radius:10px}

  /* re-import (case 2) */
  .conflict{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 20px;margin-bottom:16px}
  .conflict h4{margin:0 0 3px;font-size:16px}
  .conflict .sub{color:var(--soft);margin:0 0 12px;font-size:13px}
  .note{background:#f7f9fb;border-left:3px solid var(--teal);padding:9px 12px;border-radius:0 6px 6px 0;color:#4a4f5e;font-size:13px;margin-top:10px}
  .allist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .alrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  .alrow:last-child{border-bottom:none}
  .alwho{font-size:13.5px}
  .alwho .meta{color:var(--soft);font-size:12px;margin-top:1px}
  .funnels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 18px}
  .fn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  .fn .lab{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);margin-bottom:10px}
  .fn .stage{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0}
  .fn .stage .v{font-weight:700}
  .fn .arrow{color:var(--faint);text-align:center;font-size:11px;line-height:1}
  .fn .gap{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:6px}
  .fn .gap .pip{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
  .gap.amber .pip{background:var(--warn)} .gap.amber{color:var(--warn)}
  .gap.red .pip{background:var(--danger)} .gap.red{color:var(--danger)}
  .gap.none{color:var(--faint)} .gap.none .pip{background:#d7dbe2}
  .fn .stage.src .v{color:var(--soft)} .fn .stage.zip .v{color:var(--ink)} .fn .stage.cliq .v{color:var(--ok)}
  @media (max-width:900px){.funnels{grid-template-columns:1fr 1fr}}
  .viewbtn{border:1px solid #cdd3dd;background:#fff;border-radius:16px;padding:7px 14px;font-size:12.5px;color:var(--ink)}
  .viewbtn:hover{border-color:var(--teal);color:var(--teal)}
  .countline{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff}
  .countline .cn{font-size:20px;font-weight:700;flex:0 0 auto}
  .countline .cl{color:var(--soft);font-size:13.5px}
  .countline .ca{margin-left:auto}
  .nm-wrap{max-height:340px;overflow:auto;margin-top:4px}
  .nm-sec{margin:10px 0}
  .nm-h{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);margin:6px 0 6px;display:flex;align-items:center;gap:8px}
  .nm-h .pip{width:9px;height:9px;border-radius:2px}
  .nm-row{padding:9px 11px;border:1px solid var(--line-soft);border-radius:6px;margin-bottom:5px;font-weight:600;font-size:13px}
  .modal.wide{max-width:560px}

  /* dm preview (dark) */
  .dm{max-width:640px;margin:0 auto;background:var(--dm-bg);border-radius:12px;overflow:hidden;color:var(--dm-ink);box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .dm-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #1e2f47;background:var(--dm-panel)}
  .dm-head .av{width:34px;height:34px;border-radius:50%;background:#2a6df0;display:grid;place-items:center;color:#fff;font-size:13px}
  .dm-head b{color:#7fb2ff}
  .dm-head small{display:block;color:var(--dm-faint)}
  .dm-body{padding:14px 16px;max-height:440px;overflow:auto}
  .daysep{text-align:center;color:var(--dm-faint);font-size:12px;margin:6px 0 12px}
  .msg{display:flex;gap:10px;margin-bottom:14px}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;font-size:12px;color:#fff}
  .msg .nm{font-weight:600;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .msg .tm{color:var(--dm-faint);font-size:11px;font-weight:400}
  .msg .tx{background:transparent}
  .chip{font-size:10px;background:rgba(26,138,156,.22);color:#5fd0e0;border:1px solid rgba(26,138,156,.5);padding:1px 8px;border-radius:10px}
  .legend2{max-width:640px;margin:12px auto 0;color:var(--soft);font-size:12.5px;display:flex;gap:8px;align-items:center;justify-content:center}
  .chip.demo{background:rgba(26,138,156,.12);color:var(--teal);border-color:rgba(26,138,156,.4)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(20,24,32,.5);display:none;place-items:center;z-index:60;padding:20px}
  .scrim.show{display:grid}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:24px 24px 20px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
  .modal .mi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;margin-bottom:12px}
  .mi.q{background:#e8f4f6;color:var(--teal)}
  .mi.w{background:var(--warn-bg);color:var(--warn)}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal p{margin:0 0 6px;color:#4a4f5e}
  .modal .impact{background:var(--warn-bg);border:1px solid #f0dcae;border-radius:8px;padding:10px 12px;color:#8a6412;font-size:13px;margin:10px 0 4px}
  .modal .impact.safe{background:var(--ok-bg);border-color:#cde9d8;color:#2f6b48}
  .modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .kv{color:var(--soft);font-size:13px;margin-top:6px}

  .tip{max-width:1180px;margin:0 auto 16px;background:#fff;border:1px dashed #cdd6df;border-left:4px solid var(--teal);border-radius:8px;padding:12px 16px;color:#4a4f5e;font-size:13px}
  .tip b{color:var(--teal)}
  @media (max-width:900px){.wiz{grid-template-columns:1fr}.map{display:none}.cards{grid-template-columns:repeat(2,1fr)}.mopts{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="proto-top">
  <span class="dot"></span>
  <b>Zoho Cliq · Migration Wizard</b>
  <span class="muted">interactive prototype — click the map on the left</span>
  <div class="legend">
    <span><i class="swatch" style="background:#1a8a9c"></i>step / progress</span>
    <span><i class="swatch" style="background:#5cb488"></i>primary action</span>
    <span><i class="swatch" style="background:#c9871f"></i>impact / caution</span>
    <span><i class="swatch" style="background:#dc5a5a"></i>destructive</span>
  </div>
</div>

<div class="layout">
  <nav class="map" id="map"></nav>
  <section class="stage"><div class="device" id="device"></div></section>
</div>

<!-- modal host -->
<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>

<script>
/* ============================ helpers ============================ */
const $ = s=>document.querySelector(s);
const dev = ()=>document.getElementById('device');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* Cliq chrome ---------------------------------------------------- */
function chrome(crumb, main){
  const nav = `
   <div class="cliq-nav">
     ${['USERS & PROFILES','ORGANIZATION','AUTOMATION','PERMISSIONS','RESOURCE MANAGEMENT','CUSTOMIZATION','INTEGRATION']
        .map(g=>`<div class="grp">${g}<span>+</span></div>`).join('')}
     <div class="grp">DATA ADMINISTRATION<span>–</span></div>
     <div class="it">Export</div>
     <div class="it">Audit Logs</div>
     <div class="it on">Import External Data</div>
     <div class="it">EDiscovery</div>
     <div class="it sub">Retention Policy</div>
     <div class="it sub">Investigations</div>
     <div class="it sub">Holds</div>
     <div class="it">Data Loss Prevention</div>
     <div class="it sub">Policies</div>

/* Slack stepper -------------------------------------------------- */
function steps(cur, doneCount){
  const s=['Export from Slack','Gear up to import','Final touchdown','Ready for Cliq'];
  const rows=s.map((t,i)=>{
    const n=i+1; let cls = n<=doneCount?'done':(n===cur?'cur':'');
    return `<div class="step ${cls}"><span class="n">${n}</span>${t}</div>`;
  }).join('');
  const bars=[0,1,2,3].map(i=>`<i class="${i<doneCount?'f':''}"></i>`).join('');
  return `<div class="steps">${rows}
     <div class="prog"><b>${doneCount} / 4</b> &nbsp;Completed</div>
     <div class="bars">${bars}</div>
     <div class="help">? Get help here</div></div>`;
}

        ${c2opt('dm','replace','Replace with this upload (12 Aug 2026)','Deletes earlier-imported messages and re-creates them. Reactions & read state are lost.',true,false,dmC2)}
      </div>
    </div>

  </div>

    ['+ 11 more files','across 6 chats','Source link expired / unsupported type','Re-export, or re-share manually'],
   ]},
};
const g1=e=>e.source-e.zip;              // dropped during export
const g2=e=>e.zip-e.imported;            // failed to import
const nfmt=n=>n.toLocaleString();

function funnel(k){
  const e=ENT[k], drop=g1(e), fail=g2(e);
  const gap=(n,cls,txt)=> n>0
     ? `<div class="gap ${cls}"><span class="pip"></span>${n} ${txt}</div>`
     : `<div class="gap none"><span class="pip"></span>0 ${txt}</div>`;
  return `<div class="fn">
     <div class="lab">${e.label}</div>
     <div class="stage src"><span>In Slack</span><span class="v">${nfmt(e.source)}</span></div>
     <div class="arrow">▼</div>
     <div class="stage zip"><span>In your ZIP</span><span class="v">${nfmt(e.zip)}</span></div>
     <div class="arrow">▼</div>
     <div class="stage cliq"><span>Imported to Cliq</span><span class="v">${nfmt(e.imported)}</span></div>
     ${gap(drop,'amber','dropped during export')}
     ${gap(fail,'red','failed to import')}
   </div>`;
}
function frow(r){return `<div class="frow"><div class="id"><b>${esc(String(r[0]))}</b><span>${esc(String(r[1]))}</span></div>
   <div><span class="rtag">${esc(String(r[2]))}</span></div><div class="fix">${esc(String(r[3]))}</div></div>`;}
function tabBody(k){
  const e=ENT[k];
  const failed=e.failed.length?`<div class="sec"><div class="st"><span class="badge failed">Failed to import — was in the ZIP</span> ${g2(e)}</div>
     <p class="desc">These were inside the ZIP you uploaded, but Cliq couldn't create them.</p>${e.failed.map(frow).join('')}</div>`:'';
  const dropped=e.dropped.length?`<div class="sec"><div class="st"><span class="badge miss">Dropped during export — never in the ZIP</span> ${g1(e)}</div>
     <p class="desc">These exist in Slack but weren't in the ZIP, so Cliq never received them. Fix this in the export, then re-upload.</p>${e.dropped.map(frow).join('')}</div>`:'';
  return (failed+dropped) || `<p class="desc">Everything for this type came through cleanly. 🎉</p>`;
}
